<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academic Record Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 id="formTitle" class="text-3xl font-bold mb-6 text-center text-blue-400">Student Portal Login</h2>
        <div id="errorMsg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 rounded text-sm"></div>
        
        <form id="authForm" class="space-y-4">
            <div id="usernameField" class="hidden">
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="username" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-blue-500">
            </div>
            <div id="roleField" class="hidden">
                <label class="block text-sm font-medium mb-1">Role</label>
                <select id="role" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-blue-500">
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded transition duration-200">Login</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            <span id="toggleText">Don't have an account?</span>
            <button id="toggleBtn" class="text-blue-400 hover:underline ml-1 font-medium">Register</button>
        </p>
    </div>
    <script src="auth.js"></script>
</body>
</html>
